- insert:
    - id: asset-library
      name: dsh-asset-library
    # MCP face. It is fetched from the public repository with npx, so this row
    # works on any machine without editing a local path. The tarball URL is used
    # instead of `github:...` because npx resolves `github:` specs through git,
    # and some machines do not have git installed. Update the version in the URL
    # when a new release is published. If the machine is offline the MCP tools
    # stay unavailable; the native `asset_library` tool does not depend on this.
    - id: asset-library-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: assetlib
        command: npx
        args:
          - '-y'
          - 'https://github.com/longcheng4855-a11y/dsh-asset-library/archive/refs/tags/v0.9.1.tar.gz'
          - 'dsh-asset-library-mcp'
        toolCallTimeoutMs: 30000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1500
          maxDelayMs: 30000
          maxAttempts: 5
